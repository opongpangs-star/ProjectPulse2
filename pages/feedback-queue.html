<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>คิวงานรอตรวจ — ProjectPulse</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<a href="#pageContent" class="skip-link">ข้ามไปยังเนื้อหา</a>
<div class="app-shell" id="appShell">
  <div class="app-body" id="appBody">
    <main class="app-main">
      <div class="app-main__inner" id="pageContent">

        <div class="page-head">
          <div class="page-head__title">
            <span class="page-head__eyebrow">Feedback Queue</span>
            <h1 id="pageTitle">คิวงานรอตรวจ</h1>
            <p class="page-head__desc" id="pageDesc"></p>
          </div>
          <div class="page-head__actions">
            <a href="advisor-dashboard.html" class="btn btn-secondary">🧭 กลับแดชบอร์ดอาจารย์</a>
          </div>
        </div>

        <div class="card">
          <div class="card-hd">
            <div>
              <h3>📥 งานที่รอการตรวจ (เรียงตามความสำคัญ)</h3>
              <div class="card-hd__sub">ลำดับคิวคำนวณจากจำนวนวันที่รอ ความเสี่ยงของทีม และความใกล้ของกำหนดส่ง Milestone ถัดไป</div>
            </div>
          </div>
          <div class="table-wrap" id="queueTableWrap"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Modal: เปิดไฟล์งาน (จำลอง) -->
<div class="modal-backdrop" id="fileModalBackdrop">
  <div class="modal" style="max-width:460px;">
    <div class="modal-hd"><h3>📎 เปิดไฟล์งาน</h3><button class="modal-close" id="closeFileModal">✕</button></div>
    <div id="fileModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" id="closeFileModal2">ปิด</button>
    </div>
  </div>
</div>

<!-- Modal: ขอข้อมูลเพิ่มเติมจากนิสิต -->
<div class="modal-backdrop" id="infoModalBackdrop">
  <div class="modal" style="max-width:460px;">
    <div class="modal-hd"><h3>❓ ขอข้อมูลเพิ่มเติม</h3><button class="modal-close" id="closeInfoModal">✕</button></div>
    <div class="field">
      <label for="infoModalText">ข้อความถึงนิสิต</label>
      <textarea class="input" id="infoModalText" rows="4" placeholder="เช่น รบกวนแนบไฟล์ storyboard ฉบับล่าสุดเพิ่มเติมด้วยครับ/ค่ะ"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" id="closeInfoModal2">ยกเลิก</button>
      <button class="btn btn-primary btn-sm" id="btnSendInfoRequest">ส่งคำขอ</button>
    </div>
  </div>
</div>

<script src="../assets/js/thai-date.js"></script>
<script src="../assets/js/seed-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/nav.js"></script>
<script>PPNav.mount("feedback-queue");</script>
<script src="../assets/js/feedback-queue.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ศูนย์การแจ้งเตือน — ProjectPulse</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<a href="#pageContent" class="skip-link">ข้ามไปยังเนื้อหา</a>
<div class="app-shell" id="appShell">
  <div class="app-body" id="appBody">
    <main class="app-main">
      <div class="app-main__inner" id="pageContent">

        <div class="page-head">
          <div class="page-head__title">
            <span class="page-head__eyebrow">Notification Center</span>
            <h1 id="pageTitle">ศูนย์การแจ้งเตือน</h1>
            <p class="page-head__desc" id="pageDesc"></p>
          </div>
          <div class="page-head__actions">
            <button class="btn btn-secondary" id="btnMarkAllRead">✅ อ่านทั้งหมดแล้ว</button>
          </div>
        </div>

        <div class="card">
          <div class="tabs" id="severityTabs">
            <button type="button" class="tab-btn is-active" data-filter="all">ทั้งหมด</button>
            <button type="button" class="tab-btn" data-filter="info">ℹ️ ข้อมูล</button>
            <button type="button" class="tab-btn" data-filter="warn">⚠️ เฝ้าระวัง</button>
            <button type="button" class="tab-btn" data-filter="red">🔴 เร่งด่วน</button>
            <button type="button" class="tab-btn" data-filter="success">✅ สำเร็จ</button>
          </div>
          <div id="notifListBox" class="flex flex-col gap-2" style="margin-top:16px;"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="../assets/js/thai-date.js"></script>
<script src="../assets/js/seed-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/nav.js"></script>
<script>PPNav.mount("notifications");</script>
<script src="../assets/js/notifications.js"></script>
</body>
</html>

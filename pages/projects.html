<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects — ProjectPulse</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<a href="#pageContent" class="skip-link">ข้ามไปยังเนื้อหา</a>
<div class="app-shell" id="appShell">
  <div class="app-body" id="appBody">
    <main class="app-main">
      <div class="app-main__inner" id="pageContent">

        <div class="page-head">
          <div class="page-head__title">
            <span class="page-head__eyebrow">Projects</span>
            <h1 id="pageTitle">Projects</h1>
            <p class="page-head__desc" id="pageDesc">Every team project you can see, in one searchable grid.</p>
          </div>
        </div>

        <div id="roleGuardSlot"></div>

        <div id="projectsContent">
          <div class="card" style="margin-bottom:var(--pp-space-4);">
            <div class="flex flex-col gap-3">
              <div class="search-field" role="search">
                <span class="search-field__icon" aria-hidden="true">🔍</span>
                <input class="input" id="filterSearch" type="search" placeholder="Search by team name or project name…" aria-label="Search projects" />
              </div>
              <div class="filter-bar" id="filterBar">
                <select class="input" id="filterCourse" aria-label="Course" disabled></select>
                <select class="input" id="filterPhase" aria-label="Project phase"></select>
                <select class="input" id="filterPulse" aria-label="Pulse status"></select>
                <select class="input" id="filterDeadline" aria-label="Deadline"></select>
                <select class="input" id="filterTeam" aria-label="Student group"></select>
                <select class="input" id="filterReview" aria-label="Review status"></select>
                <button class="btn btn-ghost btn-sm" id="btnClearFilters" type="button">✕ Clear filters</button>
              </div>
              <div class="text-xs text-muted" id="resultCount"></div>
            </div>
          </div>

          <div id="projectsSkeleton" class="grid grid-auto"></div>
          <div id="projectsGrid" class="grid grid-auto" hidden></div>
          <div id="projectsEmpty" class="empty-state" hidden>
            <div class="empty-state__icon">🗂️</div>
            No projects match these filters.
            <div style="margin-top:12px;"><button class="btn btn-secondary btn-sm" id="btnEmptyClear" type="button">Clear filters</button></div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="../assets/js/thai-date.js"></script>
<script src="../assets/js/seed-data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/projects.js"></script>
<script>PPNav.mount("projects");</script>
</body>
</html>
